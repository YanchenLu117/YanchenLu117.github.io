<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="sparsediff-hover-title sparsediff-hover-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="sparsediff-hover-title">SparseDiff efficiency comparison</title>
  <desc id="sparsediff-hover-desc">SparseDiff uses 43 percent of the inference FLOPs of dense attention while preserving image quality.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#F1F5F9" />
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#CBD5E1" opacity="0.28" />
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.22" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#94A3B8" />
    </marker>
  </defs>

  <rect width="720" height="450" fill="url(#bg)" />
  <rect width="720" height="450" fill="url(#dots)" />

  <text x="32" y="46" font-size="22" font-weight="700" fill="#0F172A" letter-spacing="-0.3">SparseDiff</text>
  <rect x="176" y="26" width="132" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE" />
  <text x="242" y="44" text-anchor="middle" font-size="11" font-weight="600" fill="#1D4ED8">70% tokens pruned</text>

  <rect x="534" y="26" width="154" height="30" rx="15" fill="#ECFDF5" stroke="#A7F3D0" />
  <text x="611" y="46" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">1.8× faster sampling</text>

  <!-- Token grid with pruned tokens faded -->
  <g filter="url(#soft)">
    <rect x="32" y="104" width="32" height="32" rx="6" fill="#2563EB" />
    <rect x="72" y="104" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="112" y="104" width="32" height="32" rx="6" fill="#2563EB" />
    <rect x="152" y="104" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="192" y="104" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="232" y="104" width="32" height="32" rx="6" fill="#2563EB" />

    <rect x="32" y="144" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="72" y="144" width="32" height="32" rx="6" fill="#2563EB" />
    <rect x="112" y="144" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="152" y="144" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="192" y="144" width="32" height="32" rx="6" fill="#2563EB" />
    <rect x="232" y="144" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />

    <rect x="32" y="184" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="72" y="184" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="112" y="184" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="152" y="184" width="32" height="32" rx="6" fill="#2563EB" />
    <rect x="192" y="184" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="232" y="184" width="32" height="32" rx="6" fill="#2563EB" />

    <rect x="32" y="224" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="72" y="224" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="112" y="224" width="32" height="32" rx="6" fill="#2563EB" />
    <rect x="152" y="224" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="192" y="224" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <rect x="232" y="224" width="32" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
  </g>
  <text x="32" y="282" font-size="12.5" font-weight="500" fill="#64748B">Selected tokens</text>
  <text x="264" y="282" text-anchor="end" font-size="11" font-weight="600" fill="#2563EB">10 / 24</text>

  <line x1="282" y1="176" x2="324" y2="176" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />

  <g filter="url(#glow)">
    <rect x="334" y="120" width="150" height="104" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
  </g>
  <text x="409" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Router</text>
  <text x="409" y="172" text-anchor="middle" font-size="11" fill="#2563EB">top-k = 30%</text>
  <g>
    <rect x="374" y="192" width="9" height="20" rx="3" fill="#BFDBFE" />
    <rect x="390" y="184" width="9" height="28" rx="3" fill="#93C5FD" />
    <rect x="406" y="196" width="9" height="16" rx="3" fill="#BFDBFE" />
    <rect x="422" y="178" width="9" height="34" rx="3" fill="#2563EB" />
    <rect x="438" y="190" width="9" height="22" rx="3" fill="#60A5FA" />
  </g>

  <line x1="488" y1="176" x2="526" y2="176" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />

  <g filter="url(#soft)">
    <rect x="536" y="104" width="152" height="176" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
  </g>
  <text x="612" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">Sparse attention</text>

  <g fill="#F1F5F9">
    <circle cx="566" cy="158" r="5" />
    <circle cx="588" cy="158" r="5" />
    <circle cx="610" cy="158" r="5" />
    <circle cx="632" cy="158" r="5" />
    <circle cx="654" cy="158" r="5" />
    <circle cx="566" cy="180" r="5" />
    <circle cx="588" cy="180" r="5" />
    <circle cx="610" cy="180" r="5" />
    <circle cx="632" cy="180" r="5" />
    <circle cx="654" cy="180" r="5" />
    <circle cx="566" cy="202" r="5" />
    <circle cx="588" cy="202" r="5" />
    <circle cx="610" cy="202" r="5" />
    <circle cx="632" cy="202" r="5" />
    <circle cx="654" cy="202" r="5" />
    <circle cx="566" cy="224" r="5" />
    <circle cx="588" cy="224" r="5" />
    <circle cx="610" cy="224" r="5" />
    <circle cx="632" cy="224" r="5" />
    <circle cx="654" cy="224" r="5" />
    <circle cx="566" cy="246" r="5" />
    <circle cx="588" cy="246" r="5" />
    <circle cx="610" cy="246" r="5" />
    <circle cx="632" cy="246" r="5" />
    <circle cx="654" cy="246" r="5" />
  </g>
  <g fill="#2563EB">
    <circle cx="588" cy="158" r="5.5" />
    <circle cx="610" cy="180" r="5.5" />
    <circle cx="632" cy="202" r="5.5" />
    <circle cx="610" cy="224" r="5.5" />
    <circle cx="588" cy="246" r="5.5" />
  </g>
  <text x="612" y="266" text-anchor="middle" font-size="10.5" fill="#64748B">sparse key set</text>

  <line x1="32" y1="314" x2="688" y2="314" stroke="#E2E8F0" />
  <text x="32" y="340" font-size="12" font-weight="600" fill="#64748B">Inference FLOPs per diffusion step</text>
  <rect x="32" y="352" width="300" height="12" rx="6" fill="#E2E8F0" />
  <text x="344" y="363" font-size="11.5" fill="#64748B">Baseline · 100%</text>
  <rect x="32" y="374" width="129" height="12" rx="6" fill="#2563EB" />
  <text x="173" y="385" font-size="11.5" font-weight="600" fill="#1D4ED8">SparseDiff · 43%</text>
  <text x="688" y="404" text-anchor="end" font-size="11.5" fill="#94A3B8">Same FID · 2.3× less compute</text>
</svg>
